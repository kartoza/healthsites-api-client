[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthsites-api-client"
version = "0.1.0"
description = "Python client library for the Healthsites.io API v3"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kartoza", email = "info@kartoza.com" }
]
maintainers = [
    { name = "Tim Sutton", email = "tim@kartoza.com" }
]
keywords = [
    "healthsites",
    "api",
    "health",
    "facilities",
    "osm",
    "openstreetmap",
    "geospatial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "respx>=0.20",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/kartoza/healthsites-api-client"
Documentation = "https://kartoza.github.io/healthsites-api-client"
Repository = "https://github.com/kartoza/healthsites-api-client"
Issues = "https://github.com/kartoza/healthsites-api-client/issues"
Changelog = "https://github.com/kartoza/healthsites-api-client/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["healthsites"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["healthsites"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=healthsites --cov-report=term-missing"

[tool.coverage.run]
source = ["healthsites"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
